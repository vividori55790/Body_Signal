name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./body-signal

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: body-signal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Copy web assets into Android project
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign release APK for device testing
        env:
          KEYSTORE_PASSWORD: body-signal-ci
        run: |
          keytool -genkeypair -v \
            -keystore body-signal-ci.jks \
            -alias body-signal-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Body Signal CI, OU=Testing, O=Body Signal, C=US"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks body-signal-ci.jks \
            --ks-key-alias body-signal-ci \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out body-signal/android/app/build/outputs/apk/release/app-release-signed.apk \
            body-signal/android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: body-signal-debug-apk
          path: body-signal/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: body-signal-release-apk-signed
          path: body-signal/android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
