name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./body-signal

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: body-signal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Copy web assets into Android project
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build unsigned release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: body-signal-debug-apk
          path: body-signal/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: body-signal-release-apk-unsigned
          path: body-signal/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
