name: Verify F-Droid release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: body-signal
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: body-signal/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck, lint & run data integrity tests
        run: |
          npx tsc --noEmit
          npm run lint
          npm run test:data

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug & unsigned release APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Run E2E & security hardening tests against built APK
        run: |
          npm test
          node test/security_hardening_test.mjs
          node test/v2_1_0_features_test.mjs
          node test/v2_2_1_features_test.mjs
          node test/v2_3_0_s6_schema_test.mjs
          node test/v2_3_0_s7_taxonomy_i18n_test.mjs
          node test/v2_3_0_s8_medication_test.mjs
          node test/v2_3_0_s9_backup_durability_test.mjs
          node test/run-feedback-tests.mjs

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: body-signal-fdroid-release-unsigned
          path: body-signal/android/app/build/outputs/apk/release/app-release-unsigned.apk
