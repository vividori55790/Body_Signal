AutoName: Body Signal
Summary: Private symptom and body-signal tracker
Description: |-
  Body Signal helps you record symptoms, pain intensity (NRS 1-10), notes,
  medications, and related conditions so that you can review personal trends
  and prepare 30-second clinical briefings for medical visits.

  All health records are encrypted locally on-device with AES-GCM 256 and
  protected by PIN and AndroidKeyStore biometric authentication. No cloud
  accounts, ads, or analytics trackers are included.

  It is a personal tracking tool, not a diagnostic or emergency medical
  service.

